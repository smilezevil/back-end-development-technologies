server:
  port: 8080

spring:
  application:
    name: hotel-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_booking
    username: smilezevil
    password: ''
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      "[hibernate.format_sql]": true
      "[org.hibernate.envers.audit_table_suffix]": _aud
      "[org.hibernate.envers.revision_field_name]": rev
      "[org.hibernate.envers.revision_type_field_name]": revtype
      "[org.hibernate.envers.store_data_at_delete]": true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/course-realm
      client:
        registration:
          keycloak:
            client-id: backend-app
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/course-realm

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    scheduler-name: hotel-booking-scheduler
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            misfireThreshold: 60000
          threadPool:
            threadCount: 3

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000

exchange-rate:
  api-available: true

booking:
  summary:
    timeout-ms: 3000

rates:
  client: ${RATES_CLIENT:http}
  rest:
    url: ${RATES_REST_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
  grpc:
    target: ${RATES_GRPC_TARGET:localhost:9081}
    deadline: 2s

resilience4j:
  retry:
    instances:
      rates:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.smilezevil.hotelbooking.exception.RatesUnavailableException
        ignore-exceptions:
          - com.smilezevil.hotelbooking.exception.RateNotFoundException
          - com.smilezevil.hotelbooking.exception.RatesCircuitOpenException
  circuitbreaker:
    instances:
      rates:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.smilezevil.hotelbooking.exception.RatesUnavailableException
        ignore-exceptions:
          - com.smilezevil.hotelbooking.exception.RateNotFoundException

reports:
  booking-stats:
    interval: PT10S
    lock-at-most-for: PT30S
    lock-at-least-for: PT9S

import:
  rooms:
    directory: ${IMPORT_DIR:imports}
    chunk-size: 5
    skip-limit: 10

logging:
  level:
    net.javacrumbs.shedlock: DEBUG